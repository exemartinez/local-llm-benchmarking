[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ollama-benchmark"
version = "0.1.0"
description = "Evidence-first local Ollama coding model benchmarks for Windows 11"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Local Ollama Benchmark contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ollama-bench = "ollama_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
